name: build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install -r requirements.txt

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --additional-hooks-dir hooks --name DJIGraft-5.0-Windows-x64 --version-file windows-version.txt --icon assets/app-icon.ico --add-data "assets;assets" dji_graft_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJIGraft-windows
          path: dist/DJIGraft-5.0-Windows-x64.exe
