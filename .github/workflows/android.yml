name: android

on:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download FFmpegKitNext
        run: gradle prepareFfmpegKit

      - name: Verify container graft port
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p ../dist
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "../dist/DJIGraft-Android-${SAFE_REF}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DJIGraft-Android
          path: dist/*.apk
          if-no-files-found: error
