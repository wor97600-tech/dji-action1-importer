name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Windows exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --additional-hooks-dir hooks --name DJIGraft dji_graft_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/DJIGraft.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download FFmpegKitNext
        run: gradle prepareFfmpegKit

      - name: Verify container graft port
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Android APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "../dist/DJIGraft-Android-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs:
      - windows
      - android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist

      - name: List release files
        run: ls -lh dist

      - name: Publish Windows + Android release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
