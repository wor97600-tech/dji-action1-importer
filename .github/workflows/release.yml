name: release
on:
  push:
    tags: ["v5.1"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg for tests
        run: choco install ffmpeg -y --no-progress
      - name: Run regression tests
        run: python -m unittest discover -v
      - name: Build Windows exe
        run: ./build.ps1
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $file = Get-Item dist/DJIGraft-5.1-Windows-x64.exe
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: DJIGraft-v5.1-Windows
          path: dist/*
          if-no-files-found: error
      - name: Publish Windows v5.1
        if: github.ref == 'refs/tags/v5.1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.1
          name: DJI Graft v5.1 · Windows 正式版
          body_path: docs/releases/v5.1.md
          files: |
            dist/DJIGraft-5.1-Windows-x64.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false
